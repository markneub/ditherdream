<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ditherdream</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#ddd}
  canvas{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
  #hint{position:fixed;top:10px;left:0;right:0;text-align:center;pointer-events:none}
  #hint span{background:rgba(15,15,10,.8);padding:4px 8px;border-radius:5px}
  #mode{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));font:inherit;background:rgba(0,0,0,.8);color:#fff;border:1px solid #888;border-radius:6px;padding:8px 14px;cursor:pointer}
  #look-cue{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%);opacity:0;transition:opacity .15s}
  #look-cue.on{opacity:1}
  #err{position:fixed;top:40px;left:10px;right:10px;color:#f88;white-space:pre-wrap;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><span>drag to orbit · pinch / scroll to zoom</span></div>
<div id="err"></div>
<button id="mode">Walk the deck</button>
<script src="src/state.js"></script>
<script src="src/geometry.js"></script>
<script src="src/shaders.js"></script>
<script src="src/renderer.js"></script>
<script src="src/scene.js"></script>
<script src="src/walk.js"></script>
<script src="src/main.js"></script>
</body>
</html>
